name: Build and Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to deploy. Leave empty to deploy the selected branch.
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.vars.outputs.image-prefix }}
      image-tag: ${{ steps.vars.outputs.image-tag }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Prepare image variables
        id: vars
        shell: bash
        env:
          REQUESTED_SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment ref must resolve to a full commit SHA" >&2; exit 1; }
          image_tag="${sha::12}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image-tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image-prefix=$image_prefix" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image-prefix }}/backend:${{ steps.vars.outputs.image-tag }}
            ${{ steps.vars.outputs.image-prefix }}/backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ steps.vars.outputs.image-prefix }}/frontend:${{ steps.vars.outputs.image-tag }}
            ${{ steps.vars.outputs.image-prefix }}/frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Blue-green deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PROGO_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.PROGO_DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.PROGO_DEPLOY_PORT }}
      DEPLOY_APP_DIR: ${{ secrets.PROGO_DEPLOY_APP_DIR }}
      DEPLOY_HOST_KEY: ${{ secrets.PROGO_DEPLOY_HOST_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.PROGO_DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_HOST_KEY"
          test -n "$DEPLOY_SSH_KEY"
          port="${DEPLOY_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/progo_deploy"
          chmod 600 "$HOME/.ssh/progo_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "port=$port" >> "$GITHUB_ENV"

      - name: Package deploy assets
        shell: bash
        run: |
          set -euo pipefail
          tar -czf progo-deploy-assets.tar.gz deploy migrations

      - name: Upload deploy assets
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$port" -i "$HOME/.ssh/progo_deploy" progo-deploy-assets.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/progo-deploy-assets.tar.gz"

      - name: Install deploy assets on VM
        shell: bash
        run: |
          set -euo pipefail
          app_dir="${DEPLOY_APP_DIR:-/opt/progo/app}"
          ssh -p "$port" -i "$HOME/.ssh/progo_deploy" "$DEPLOY_USER@$DEPLOY_HOST" "set -e; sudo mkdir -p '$app_dir'; sudo chown -R '$DEPLOY_USER':'$DEPLOY_USER' '$app_dir'; rm -rf '$app_dir/deploy' '$app_dir/migrations'; tar -xzf /tmp/progo-deploy-assets.tar.gz -C '$app_dir'; chmod +x '$app_dir/deploy/bluegreen-deploy.sh'; rm -f /tmp/progo-deploy-assets.tar.gz"

      - name: Log VM in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -p "$port" -i "$HOME/.ssh/progo_deploy" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy inactive color and switch Caddy
        shell: bash
        run: |
          set -euo pipefail
          app_dir="${DEPLOY_APP_DIR:-/opt/progo/app}"
          ssh -p "$port" -i "$HOME/.ssh/progo_deploy" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$app_dir' && IMAGE_PREFIX='${{ needs.build.outputs.image-prefix }}' IMAGE_TAG='${{ needs.build.outputs.image-tag }}' APP_DIR='$app_dir' '$app_dir/deploy/bluegreen-deploy.sh'"
