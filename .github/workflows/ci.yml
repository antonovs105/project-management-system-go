name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test -count=1 ./...

      - name: Test backend integration
        working-directory: backend
        env:
          TEST_DB_SOURCE: postgres://postgres:postgres@localhost:5432/pms_test?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/integration
