name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.5
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce backend coverage floor
        working-directory: backend
        shell: bash
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%", "", $3); print $3}')"
          echo "backend coverage: ${coverage}%"
          awk "BEGIN {exit !(${coverage} >= 35)}"

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Test backend integration
        working-directory: backend
        env:
          TEST_DB_SOURCE: postgres://postgres:postgres@localhost:5432/pms_test?sslmode=disable
        run: go test -tags=integration -count=1 ./internal/integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify generated API types
        working-directory: frontend
        run: pnpm check:api

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Audit complete frontend dependency graph
        working-directory: frontend
        run: pnpm audit --audit-level high

  deployment-restore:
    name: Deployment restore drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare local deployment configuration
        run: cp .env.example .env

      - name: Validate deploy scripts and Compose
        run: |
          sh -n deploy/install.sh deploy/bluegreen-deploy.sh deploy/backup.sh deploy/restore-backup.sh
          docker compose config --quiet

      - name: Start disposable database and backend
        run: docker compose up -d --build db redis migrations backend

      - name: Create restore probe and verified backup
        run: |
          docker compose exec -T db psql -U postgres -d pms -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE restore_probe (value text NOT NULL); INSERT INTO restore_probe VALUES ('before-backup');"
          APP_DIR="$PWD" ENV_FILE="$PWD/.env" COMPOSE_FILE="$PWD/docker-compose.yml" \
            BACKUP_DIR="$RUNNER_TEMP/progo-backups" BACKUP_ATTACHMENT_SERVICE=backend \
            sh deploy/backup.sh

      - name: Mutate data and restore the backup
        run: |
          docker compose exec -T db psql -U postgres -d pms -v ON_ERROR_STOP=1 -c \
            "UPDATE restore_probe SET value = 'after-backup';"
          bundle="$(find "$RUNNER_TEMP/progo-backups" -mindepth 1 -maxdepth 1 -type d -name 'Progo-*' | head -n 1)"
          test -n "$bundle"
          APP_DIR="$PWD" ENV_FILE="$PWD/.env" COMPOSE_FILE="$PWD/docker-compose.yml" \
            RESTORE_CONFIRM=Progo SKIP_PRE_RESTORE_BACKUP=true BACKUP_ATTACHMENT_SERVICE=backend \
            RESTORE_STOP_SERVICES=backend RESTORE_START_SERVICES=backend \
            sh deploy/restore-backup.sh "$bundle"
          value="$(docker compose exec -T db psql -U postgres -d pms -Atc 'SELECT value FROM restore_probe')"
          test "$value" = "before-backup"

      - name: Stop disposable deployment
        if: always()
        run: docker compose down -v
