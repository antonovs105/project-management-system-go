services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations/
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      APP_ROLE: api
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost:8080}
      REDIS_ADDR: redis:6379
      FEDERATION_BLOCKED_DOMAINS: ${FEDERATION_BLOCKED_DOMAINS:-}
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:5173/oauth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/github/callback}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_WORKER_METRICS_PORT:-9091}:9091"
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      APP_ROLE: worker
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost:8080}
      REDIS_ADDR: redis:6379
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-}
      METRICS_ADDR: :9091
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:5173/oauth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:8080/auth/github/callback}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.11.3
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        umask 077
        printf '%s' "$${METRICS_TOKEN}" > /prometheus/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      backend-worker:
        condition: service_started
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
