      - federation

  frontend-blue:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-blue-frontend
    init: true
    ports:
      - "127.0.0.1:${BLUE_FRONTEND_PORT:-15173}:8080"
    depends_on:
      backend-blue:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
