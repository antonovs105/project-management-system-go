      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      APP_ROLE: worker
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:?LOCAL_DOMAIN is required}
      REDIS_ADDR: redis:6379
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-false}
      FEDERATION_ALLOW_PRIVATE_NETWORKS: ${FEDERATION_ALLOW_PRIVATE_NETWORKS:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      PROJECT_CREATION_POLICY: ${PROJECT_CREATION_POLICY:-everyone}
      AUTH_RATE_LIMIT_PER_SECOND: ${AUTH_RATE_LIMIT_PER_SECOND:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-10}
      DISCOVERY_RATE_LIMIT_PER_SECOND: ${DISCOVERY_RATE_LIMIT_PER_SECOND:-10}
      DISCOVERY_RATE_LIMIT_BURST: ${DISCOVERY_RATE_LIMIT_BURST:-50}
      INBOX_RATE_LIMIT_PER_SECOND: ${INBOX_RATE_LIMIT_PER_SECOND:-20}
      INBOX_RATE_LIMIT_BURST: ${INBOX_RATE_LIMIT_BURST:-100}
      METRICS_ADDR: :9091
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9091/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - default
      - federation

  backend-worker-green:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-green-backend-worker
    init: true
    ports:
      - "127.0.0.1:${GREEN_BACKEND_WORKER_METRICS_PORT:-19092}:9091"
    volumes:
      - ${PROGO_CONFIG_FILE:?PROGO_CONFIG_FILE is required}:/etc/progo/progo.yml:ro
    environment:
      PROGO_CONFIG: /etc/progo/progo.yml
      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-production}
      APP_ROLE: worker
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:?LOCAL_DOMAIN is required}
      REDIS_ADDR: redis:6379
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-false}
      FEDERATION_ALLOW_PRIVATE_NETWORKS: ${FEDERATION_ALLOW_PRIVATE_NETWORKS:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      PROJECT_CREATION_POLICY: ${PROJECT_CREATION_POLICY:-everyone}
      AUTH_RATE_LIMIT_PER_SECOND: ${AUTH_RATE_LIMIT_PER_SECOND:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-10}
      DISCOVERY_RATE_LIMIT_PER_SECOND: ${DISCOVERY_RATE_LIMIT_PER_SECOND:-10}
      DISCOVERY_RATE_LIMIT_BURST: ${DISCOVERY_RATE_LIMIT_BURST:-50}
      INBOX_RATE_LIMIT_PER_SECOND: ${INBOX_RATE_LIMIT_PER_SECOND:-20}
      INBOX_RATE_LIMIT_BURST: ${INBOX_RATE_LIMIT_BURST:-100}
      METRICS_ADDR: :9091
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
