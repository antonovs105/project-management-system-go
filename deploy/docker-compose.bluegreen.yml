    networks:
      federation:
        aliases:
          - ${INSTANCE_NAME:?INSTANCE_NAME is required}-blue-frontend

  frontend-green:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-green-frontend
    init: true
    ports:
      - "127.0.0.1:${GREEN_FRONTEND_PORT:-15174}:8080"
    depends_on:
      backend-green:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      federation:
        aliases:
          - ${INSTANCE_NAME:?INSTANCE_NAME is required}-green-frontend

networks:
  default:
  federation:
    name: ${FEDERATION_NETWORK:-pms-federation}
    external: true

volumes:
  postgres_data:
  redis_data:
