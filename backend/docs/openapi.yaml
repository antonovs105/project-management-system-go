        "200":
          $ref: "#/components/responses/ActivityPubDocument"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: progo.session
      description: HttpOnly SameSite=Strict browser session cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    metricsBearerAuth:
      type: http
      scheme: bearer
      description: Optional in development; required when METRICS_TOKEN is configured.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong numeric entity version returned as ETag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    ActivityID:
      name: activityID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentID:
      name: commentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryID:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GitHubRepositoryID:
      name: repositoryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GitHubCommitID:
      name: commitID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteID:
      name: inviteID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkID:
      name: linkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RemoteProjectID:
      name: remoteProjectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RemoteTicketID:
      name: remoteTicketID
      in: path
      required: true
      description: URL-safe base64 encoding of the remote ticket ActivityPub ID.
      schema:
        type: string
    RoleID:
      name: roleID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    ActivityPubDocument:
      required: true
      content:
        application/activity+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
        application/ld+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
    AddProjectMember:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
                deprecated: true
              user_ref:
                type: string
                description: Invite target UUID, handle, acct handle, username, or local email.
              role_id:
                type: string
                format: uuid
              role:
                $ref: "#/components/schemas/ProjectRoleKey"
    AddTicketLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target_id, link_type]
            properties:
              target_id:
                type: string
                format: uuid
              link_type:
                type: string
    CreateComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: string
    BlockFederationDomain:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [domain]
            properties:
              domain:
                type: string
              reason:
                type: string
    RemoteFederationResource:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [resource]
            properties:
              resource:
                type: string
                description: "Remote acct: resource, bare handle, or actor URL."
              target:
                type: string
                deprecated: true
    CreateProject:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
    LinkGitHubRepository:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [owner, name]
            properties:
              owner:
                type: string
                example: antonovs105
              name:
                type: string
                example: project-management-system-go
    LinkGitHubCommit:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [commit_id]
            properties:
              commit_id:
                type: string
                format: uuid
    CreateTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, priority, type]
            properties:
              title:
                type: string
              description:
                type: string
              priority:
                $ref: "#/components/schemas/TicketPriority"
              type:
                $ref: "#/components/schemas/TicketType"
              parent_id:
                type:
                  - string
                  - "null"
                format: uuid
              assignee_id:
                type:
                  - string
                  - "null"
                format: uuid
              due_date:
                type: string
                format: date
              label_ids:
                type: array
                maxItems: 20
                uniqueItems: true
                items:
                  type: string
                  format: uuid
    LoginUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              mfa_code:
                type: string
                description: Current TOTP or unused recovery code when MFA is enabled.
    MFACode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
    ExchangeOAuthCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code:
                type: string
              mfa_code:
                type: string
                description: Current TOTP or unused recovery code when MFA is enabled.
    RegisterUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, email, password]
            properties:
              username:
                type: string
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [current_password, new_password]
            properties:
              current_password:
                type: string
                format: password
              new_password:
                type: string
                format: password
    UpdateProject:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
    CreateProjectRole:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, permissions]
            properties:
              name:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPermission"
    UpdateProjectRole:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              permissions:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPermission"
    UpdateProjectMemberRole:
      required: true
      content:
        application/json:
          schema:
            type: object
            oneOf:
              - required: [role_id]
              - required: [role]
            properties:
              role_id:
                type: string
                format: uuid
              role:
                $ref: "#/components/schemas/ProjectRoleKey"
    UpdateInstanceRole:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [instance_role]
            properties:
              instance_role:
