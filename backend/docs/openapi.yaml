    post:
      tags: [Tickets]
      operationId: uploadTicketAttachment
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "201": {description: Validated attachment stored., content: {application/json: {schema: {$ref: "#/components/schemas/TicketAttachment"}}}}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
