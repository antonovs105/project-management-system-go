openapi: 3.1.0
info:
  title: Project Management Federation API
  version: 0.1.0
  description: Backend REST, ActivityPub, C2S, S2S inbox, WebFinger, and delivery administration contract.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Tickets
  - name: Comments
  - name: Delivery
  - name: Federation Moderation
  - name: WebFinger
  - name: ActivityPub
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/Error"
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /register:
    post:
      tags: [Auth]
      operationId: registerUser
      requestBody:
        $ref: "#/components/requestBodies/RegisterUser"
      responses:
        "201":
          description: User actor created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
  /login:
    post:
      tags: [Auth]
      operationId: loginUser
      requestBody:
        $ref: "#/components/requestBodies/LoginUser"
      responses:
        "200":
          description: JWT issued.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
  /api/me:
    get:
      tags: [Auth]
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user summary.
          content:
            application/json:
              schema:
                type: object
                required: [message, user_id]
                properties:
                  message:
                    type: string
                  user_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Error"
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects visible to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CreateProject"
      responses:
        "201":
          description: Project actor created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Projects]
      operationId: getProject
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Projects]
      operationId: updateProject
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/UpdateProject"
      responses:
        "204":
          description: Project updated.
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Projects]
      operationId: deleteProject
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Project deleted.
        "404":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [Projects]
      operationId: inviteProjectMember
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AddProjectMember"
      responses:
        "202":
          description: Project invite created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInvite"
        "409":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/UserID"
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Member removed.
        "403":
          $ref: "#/components/responses/Error"
  /api/invites/{inviteID}/accept:
    parameters:
      - $ref: "#/components/parameters/InviteID"
    post:
      tags: [Projects]
      operationId: acceptProjectInvite
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invite accepted.
        "409":
          $ref: "#/components/responses/Error"
  /api/invites/{inviteID}/reject:
    parameters:
      - $ref: "#/components/parameters/InviteID"
    post:
      tags: [Projects]
      operationId: rejectProjectInvite
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invite rejected.
        "409":
          $ref: "#/components/responses/Error"
  /api/invites/{inviteID}/revoke:
    parameters:
      - $ref: "#/components/parameters/InviteID"
    post:
      tags: [Projects]
      operationId: revokeProjectInvite
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Invite revoked.
        "409":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}/tickets:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Tickets]
      operationId: listProjectTickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tickets in the project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      tags: [Tickets]
      operationId: createTicket
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CreateTicket"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}/graph:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Tickets]
      operationId: getProjectTicketGraph
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Graph projection for project tickets and links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
  /api/tickets/{ticketID}:
    parameters:
      - $ref: "#/components/parameters/TicketID"
    get:
      tags: [Tickets]
      operationId: getTicket
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Tickets]
      operationId: updateTicket
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/UpdateTicket"
      responses:
        "204":
          description: Ticket updated.
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Tickets]
      operationId: deleteTicket
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Ticket deleted.
        "404":
          $ref: "#/components/responses/Error"
  /api/tickets/{ticketID}/links:
    parameters:
      - $ref: "#/components/parameters/TicketID"
    post:
      tags: [Tickets]
      operationId: addTicketLink
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/AddTicketLink"
      responses:
        "201":
          description: Link created.
        "400":
          $ref: "#/components/responses/Error"
  /api/links/{linkID}:
    parameters:
      - $ref: "#/components/parameters/LinkID"
    delete:
      tags: [Tickets]
      operationId: removeTicketLink
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Link removed.
        "404":
          $ref: "#/components/responses/Error"
  /api/tickets/{ticketID}/comments:
    parameters:
      - $ref: "#/components/parameters/TicketID"
    get:
      tags: [Comments]
      operationId: listTicketComments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Comments on a ticket.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      tags: [Comments]
      operationId: createComment
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/CreateComment"
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/Error"
  /api/comments/{commentID}:
    parameters:
      - $ref: "#/components/parameters/CommentID"
    delete:
      tags: [Comments]
      operationId: deleteComment
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Comment deleted.
        "404":
          $ref: "#/components/responses/Error"
  /api/projects/{projectID}/deliveries:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Delivery]
      operationId: listProjectDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, processing, delivered, failed, dead]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Delivery rows scoped to a project.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delivery"
  /api/projects/{projectID}/deliveries/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [Delivery]
      operationId: getProjectDeliverySummary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project delivery counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySummary"
  /api/projects/{projectID}/deliveries/{deliveryID}/retry:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      tags: [Delivery]
      operationId: retryProjectDelivery
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Delivery scheduled for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delivery"
        "409":
          $ref: "#/components/responses/Error"
  /api/admin/federation/domain-blocks:
    get:
      tags: [Federation Moderation]
      operationId: listFederationDomainBlocks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Blocked federation domains.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederationDomainBlock"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Federation Moderation]
      operationId: blockFederationDomain
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/BlockFederationDomain"
      responses:
        "201":
          description: Domain block created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationDomainBlock"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/admin/federation/domain-blocks/{domain}:
    parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Federation Moderation]
      operationId: unblockFederationDomain
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Domain block removed.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/admin/federation/remote-actors:
    get:
      tags: [Federation Moderation]
      operationId: listFederationRemoteActors
      security:
        - bearerAuth: []
      parameters:
        - name: fetch_error
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Remote actors cached by federation discovery.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederationRemoteActor"
        "403":
          $ref: "#/components/responses/Error"
  /api/admin/federation/deliveries:
    get:
      tags: [Federation Moderation]
      operationId: listFederationDeliveries
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, processing, delivered, failed, dead]
        - name: failure_kind
          in: query
          schema:
            type: string
            enum: [http, network, signing, safety, unknown]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Federation delivery attempts across all projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederationDelivery"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /.well-known/webfinger:
    get:
      tags: [WebFinger]
      operationId: resolveWebFinger
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            example: acct:alice@localhost:8080
      responses:
        "200":
          description: WebFinger resource descriptor.
          content:
            application/jrd+json:
              schema:
                $ref: "#/components/schemas/WebFingerResource"
        "404":
          $ref: "#/components/responses/Error"
  /users/{username}:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [ActivityPub]
      operationId: getUserActorDocument
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
        "404":
          $ref: "#/components/responses/Error"
  /users/{username}/inbox:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [ActivityPub]
      operationId: getUserInbox
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
    post:
      tags: [ActivityPub]
      operationId: postUserInbox
      requestBody:
        $ref: "#/components/requestBodies/ActivityPubDocument"
      responses:
        "202":
          description: Activity accepted into the target inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundActivityAccepted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /users/{username}/outbox:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [ActivityPub]
      operationId: getUserOutbox
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
    post:
      tags: [ActivityPub]
      operationId: postUserOutboxC2S
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ActivityPubDocument"
      responses:
        "201":
          $ref: "#/components/responses/ActivityPubDocument"
        "422":
          $ref: "#/components/responses/Error"
  /users/{username}/followers:
    parameters:
      - $ref: "#/components/parameters/Username"
    get:
      tags: [ActivityPub]
      operationId: getUserFollowers
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [ActivityPub]
      operationId: getProjectActorDocument
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
        "404":
          $ref: "#/components/responses/Error"
  /projects/{projectID}/inbox:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [ActivityPub]
      operationId: getProjectInbox
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
    post:
      tags: [ActivityPub]
      operationId: postProjectInbox
      requestBody:
        $ref: "#/components/requestBodies/ActivityPubDocument"
      responses:
        "202":
          description: Activity accepted into the project inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundActivityAccepted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /projects/{projectID}/outbox:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [ActivityPub]
      operationId: getProjectOutbox
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /projects/{projectID}/followers:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [ActivityPub]
      operationId: getProjectFollowers
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /projects/{projectID}/tickets:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [ActivityPub]
      operationId: getProjectTicketsCollection
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /tickets/{ticketID}:
    parameters:
      - $ref: "#/components/parameters/TicketID"
    get:
      tags: [ActivityPub]
      operationId: getTicketDocument
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /comments/{commentID}:
    parameters:
      - $ref: "#/components/parameters/CommentID"
    get:
      tags: [ActivityPub]
      operationId: getCommentDocument
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
  /activities/{activityID}:
    parameters:
      - $ref: "#/components/parameters/ActivityID"
    get:
      tags: [ActivityPub]
      operationId: getActivityDocument
      responses:
        "200":
          $ref: "#/components/responses/ActivityPubDocument"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ActivityID:
      name: activityID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentID:
      name: commentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryID:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteID:
      name: inviteID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LinkID:
      name: linkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticketID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    ActivityPubDocument:
      required: true
      content:
        application/activity+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
        application/ld+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
    AddProjectMember:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [user_id, role]
            properties:
              user_id:
                type: string
                format: uuid
              role:
                $ref: "#/components/schemas/ProjectRole"
    AddTicketLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target_id, link_type]
            properties:
              target_id:
                type: string
                format: uuid
              link_type:
                type: string
    CreateComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content:
                type: string
    BlockFederationDomain:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [domain]
            properties:
              domain:
                type: string
              reason:
                type: string
    CreateProject:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                type: string
              description:
                type: string
    CreateTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, priority, type]
            properties:
              title:
                type: string
              description:
                type: string
              priority:
                $ref: "#/components/schemas/TicketPriority"
              type:
                $ref: "#/components/schemas/TicketType"
              parent_id:
                type:
                  - string
                  - "null"
                format: uuid
              assignee_id:
                type:
                  - string
                  - "null"
                format: uuid
    LoginUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    RegisterUser:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [username, email, password]
            properties:
              username:
                type: string
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    UpdateProject:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
    UpdateTicket:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              status:
                $ref: "#/components/schemas/TicketStatus"
              priority:
                $ref: "#/components/schemas/TicketPriority"
              type:
                $ref: "#/components/schemas/TicketType"
              parent_id:
                type:
                  - string
                  - "null"
                format: uuid
              assignee_id:
                type:
                  - string
                  - "null"
                format: uuid
  responses:
    ActivityPubDocument:
      description: ActivityStreams JSON-LD document.
      content:
        application/activity+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
        application/ld+json:
          schema:
            $ref: "#/components/schemas/ActivityPubDocument"
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ActivityPubDocument:
      type: object
      additionalProperties: true
    Comment:
      type: object
