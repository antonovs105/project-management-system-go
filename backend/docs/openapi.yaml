          type: string
          format: date-time
    ProjectRole:
      type: object
      required: [id, project_id, key, name, description, is_system, position, permissions, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        key:
          $ref: "#/components/schemas/ProjectRoleKey"
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        position:
          type: integer
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ProjectPermission"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectRoleKey:
      type: string
      description: Project-local role key. Default keys are owner, manager, developer, and viewer.
    ProjectPermission:
      type: string
      enum:
        - project.read
        - project.update
        - project.delete
        - members.invite
        - members.remove
        - roles.manage
        - tickets.create
        - tickets.update
        - tickets.delete
        - comments.create
        - comments.moderate
        - federation.delivery.retry
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, error, disabled, missing]
        missing_tables:
          type: array
          items:
            type: string
    Label:
      type: object
      required: [id, project_id, name, color, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        created_at:
          type: string
          format: date-time
    Ticket:
      type: object
      required: [id, ap_id, title, description, status, priority, type, project_id, reporter_id, is_resolved, version, archived_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ap_id:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        priority:
          $ref: "#/components/schemas/TicketPriority"
        type:
          $ref: "#/components/schemas/TicketType"
        parent_id:
          type:
            - string
            - "null"
          format: uuid
        project_id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
        assignee_id:
          type:
            - string
            - "null"
          format: uuid
        is_resolved:
          type: boolean
        due_date:
          type:
            - string
            - "null"
          format: date-time
        label_ids:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        archived_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TicketEvent:
      type: object
      required: [id, type, project_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ticket.created, ticket.updated, ticket.deleted, ticket.linked, ticket.unlinked]
        project_id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
    TicketPriority:
      type: string
      enum: [low, medium, high, urgent]
    TicketStatus:
      type: string
      enum: [open, in_progress, review, done]
    TicketType:
      type: string
      enum: [epic, task, subtask]
    ArchivedProject:
      type: object
      required: [id, name, description, version, archived_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        archived_at: {type: string, format: date-time}
    TicketAttachment:
      type: object
      required: [id, ticket_id, uploader_id, filename, content_type, size_bytes, sha256, created_at]
      properties:
        id: {type: string, format: uuid}
        ticket_id: {type: string, format: uuid}
        uploader_id: {type: string, format: uuid}
        filename: {type: string, maxLength: 255}
        content_type: {type: string}
        size_bytes: {type: integer, format: int64, minimum: 1, maximum: 10485760}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
    NotificationType:
      type: string
      enum:
        - ticket.assigned
        - ticket.status_changed
        - ticket.due_soon
        - ticket.overdue
        - comment.created
        - comment.mentioned
        - project.invited
        - project.role_changed
        - federation.delivery_failed
        - security.event
    Notification:
      type: object
      required: [id, user_id, type, title, body, created_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        actor_id: {type: [string, "null"], format: uuid}
        project_id: {type: [string, "null"], format: uuid}
        ticket_id: {type: [string, "null"], format: uuid}
        type: {$ref: "#/components/schemas/NotificationType"}
        title: {type: string}
        body: {type: string}
        read_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationPreference:
      type: object
      required: [type, in_app_enabled, email_enabled]
      properties:
        type: {$ref: "#/components/schemas/NotificationType"}
        in_app_enabled: {type: boolean}
        email_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    ArchivedTicket:
      type: object
      required: [id, project_id, title, version, archived_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        title: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        archived_at: {type: string, format: date-time}
    ProjectActivityEvent:
      type: object
      required: [id, project_id, entity_type, entity_id, action, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        actor_id: {type: [string, "null"], format: uuid}
        actor_handle: {type: [string, "null"]}
        entity_type: {type: string, enum: [project, ticket]}
        entity_id: {type: string, format: uuid}
        action: {type: string, enum: [created, updated, archived, restored]}
        before_state: {type: [object, "null"]}
        after_state: {type: [object, "null"]}
        created_at: {type: string, format: date-time}
    AccountSession:
      type: object
      required: [id, user_agent, ip_address, created_at, last_seen_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        current:
          type: boolean
    SecurityEvent:
      type: object
      required: [id, event_type, ip_address, user_agent, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, ap_id, username, email, email_verified, instance_role, handle, name, summary, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ap_id:
          type: string
          format: uri
        username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        instance_role:
          $ref: "#/components/schemas/InstanceRole"
        handle:
          type: string
        name:
          type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InstanceRole:
      type: string
      enum: [owner, admin, user]
    WebFingerResource:
      type: object
      required: [subject, links]
      properties:
        subject:
          type: string
        aliases:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: object
            required: [rel]
            properties:
              rel:
                type: string
              type:
                type: string
              href:
                type: string
                format: uri
