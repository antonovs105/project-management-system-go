openapi: 3.1.0
info:
  title: Project Management Federation API
  version: 0.1.0
  description: Backend REST, ActivityPub, C2S, S2S inbox, WebFinger, and delivery administration contract.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Instance
  - name: Projects
  - name: Tickets
  - name: Comments
  - name: Delivery
  - name: Federation
  - name: GitHub Integration
  - name: Admin Audit
  - name: Federation Moderation
  - name: WebFinger
  - name: ActivityPub
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: API process is alive; dependency readiness is reported by /ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /metrics:
    get:
      tags: [Health]
      operationId: getMetrics
      security:
        - metricsBearerAuth: []
      responses:
        "200":
          description: Prometheus metrics for the backend process.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /webhooks/github:
    post:
      tags: [GitHub Integration]
      operationId: handleGitHubWebhook
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: GitHub webhook accepted after HMAC verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubWebhookResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /instance:
    get:
      tags: [Instance]
      operationId: getPublicInstance
      responses:
        "200":
          description: Public instance metadata and unauthenticated capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicInstanceConfig"
  /register:
    post:
      tags: [Auth]
      operationId: registerUser
      requestBody:
        $ref: "#/components/requestBodies/RegisterUser"
      responses:
        "201":
          description: User actor created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /login:
    post:
      tags: [Auth]
      operationId: loginUser
      requestBody:
        $ref: "#/components/requestBodies/LoginUser"
      responses:
        "200":
          description: HttpOnly session cookie established.
          headers:
            Set-Cookie:
              description: Hardened Progo browser session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [user_id, instance_role]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  instance_role:
                    type: string
                    enum: [owner, admin, user]
                  email:
                    type: string
                    format: email
                  email_verified:
                    type: boolean
                  mfa_enrollment_required:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
  /auth/oauth/providers:
    get:
      tags: [Auth]
      operationId: listOAuthProviders
      responses:
        "200":
          description: Optional OAuth providers configured for this instance.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      enum: [google, github]
  /auth/{provider}/start:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github]
    get:
      tags: [Auth]
      operationId: startOAuthLogin
      responses:
        "302":
          description: Redirect to the provider authorization URL.
        "404":
          $ref: "#/components/responses/Error"
  /auth/{provider}/callback:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, github]
    get:
      tags: [Auth]
      operationId: completeOAuthProviderCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend OAuth callback with a one-time code or safe error code.
  /auth/oauth/exchange:
    post:
      tags: [Auth]
      operationId: exchangeOAuthLoginCode
      requestBody:
        $ref: "#/components/requestBodies/ExchangeOAuthCode"
      responses:
        "200":
          description: HttpOnly session cookie established after consuming a one-time OAuth code.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, instance_role]
                properties:
                  user_id:
                    type: string
                    format: uuid
                  instance_role:
                    type: string
                    enum: [owner, admin, user]
                  email:
                    type: string
                    format: email
                  email_verified:
                    type: boolean
                  mfa_enrollment_required:
                    type: boolean
        "401":
          $ref: "#/components/responses/Error"
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Recovery request accepted regardless of account existence.
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
      responses:
        "204":
          description: Password replaced and existing sessions revoked.
        "400":
          $ref: "#/components/responses/Error"
  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyLocalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Email ownership verified.
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/instance:
    get:
      tags: [Instance]
      operationId: getInstanceCapabilities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance metadata and current-user capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceCapabilities"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user summary.
          content:
            application/json:
              schema:
                type: object
                required: [message, user_id]
                properties:
                  message:
                    type: string
                  user_id:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/password:
    patch:
      tags: [Auth]
      operationId: changeCurrentUserPassword
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ChangePassword"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/notifications:
    get:
      tags: [Notifications]
      operationId: listCurrentUserNotifications
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: unread, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Current user notifications.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Notification"}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/me/notifications/events:
    get:
      tags: [Notifications]
      operationId: streamCurrentUserNotifications
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200":
          description: Server-sent notification event stream.
          content:
            text/event-stream:
              schema: {type: string}
  /api/v1/me/notifications/{id}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Updated notification., content: {application/json: {schema: {$ref: "#/components/schemas/Notification"}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/me/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "204": {description: All notifications marked read.}
  /api/v1/me/notification-preferences:
    get:
      tags: [Notifications]
      operationId: listNotificationPreferences
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        "200":
          description: Complete notification delivery preference catalog.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/NotificationPreference"}}
  /api/v1/me/notification-preferences/{type}:
    put:
      tags: [Notifications]
      operationId: updateNotificationPreference
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: type, in: path, required: true, schema: {$ref: "#/components/schemas/NotificationType"}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [in_app_enabled, email_enabled]
              properties:
                in_app_enabled: {type: boolean}
                email_enabled: {type: boolean}
      responses:
        "200": {description: Updated preference., content: {application/json: {schema: {$ref: "#/components/schemas/NotificationPreference"}}}}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/me/invites:
    get:
      tags: [Projects]
      operationId: listCurrentUserProjectInvites
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, revoked]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Project invites addressed to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectInviteInspection"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/federation/inbox:
    get:
      tags: [Federation]
      operationId: listPersonalFederationInbox
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TicketPriority"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TicketType"
        - name: assignee
          in: query
          schema:
            type: string
            enum: [me, unassigned]
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Normalized ActivityPub activities delivered to the authenticated user's inbox.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederationInboxActivity"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/federation/discover:
    post:
      tags: [Federation]
      operationId: discoverPersonalFederationActor
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/RemoteFederationResource"
      responses:
        "200":
          description: Remote ActivityPub actor resolved and cached for federation actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationRemoteActor"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/me/federation/follows:
    get:
      tags: [Federation]
      operationId: listPersonalFederationFollows
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Remote actors followed by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FederationRemoteFollow"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [Federation]
      operationId: followPersonalFederationActor
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/RemoteFederationResource"
      responses:
        "200":
          description: The authenticated user already follows this remote actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRemoteActorResult"
        "202":
          description: Follow activity created and queued for federation delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRemoteActorResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/projects/archived:
    get:
      tags: [Projects]
      operationId: listArchivedProjects
      security: [{cookieAuth: []}]
      responses:
        "200":
          description: Restorable projects for the current user.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ArchivedProject"}}
  /api/v1/projects/{projectID}/activity:
    get:
      tags: [Projects]
      operationId: listProjectActivity
      security: [{cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Immutable project and ticket change history.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ProjectActivityEvent"}}
  /api/v1/projects/{projectID}/tickets/archived:
    get:
      tags: [Tickets]
      operationId: listArchivedTickets
      security: [{cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: Restorable project tickets.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/ArchivedTicket"}}
  /api/v1/projects/{projectID}/archive:
    post:
      tags: [Projects]
      operationId: archiveProject
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/IfMatch"}]
      responses: {"204": {description: Project archived.}, "412": {$ref: "#/components/responses/Error"}, "428": {$ref: "#/components/responses/Error"}}
  /api/v1/projects/{projectID}/restore:
    post:
      tags: [Projects]
      operationId: restoreProject
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ProjectID"}, {$ref: "#/components/parameters/IfMatch"}]
      responses: {"204": {description: Project restored.}, "412": {$ref: "#/components/responses/Error"}, "428": {$ref: "#/components/responses/Error"}}
  /api/v1/tickets/{ticketID}/archive:
    post:
      tags: [Tickets]
      operationId: archiveTicket
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/TicketID"}, {$ref: "#/components/parameters/IfMatch"}]
      responses: {"204": {description: Ticket archived.}, "412": {$ref: "#/components/responses/Error"}, "428": {$ref: "#/components/responses/Error"}}
  /api/v1/tickets/{ticketID}/restore:
    post:
      tags: [Tickets]
      operationId: restoreTicket
      security: [{cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/TicketID"}, {$ref: "#/components/parameters/IfMatch"}]
      responses: {"204": {description: Ticket restored.}, "412": {$ref: "#/components/responses/Error"}, "428": {$ref: "#/components/responses/Error"}}
  /api/v1/me/email/verification:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      security:
        - cookieAuth: []
      responses:
        "202":
          description: Replacement verification email queued.
  /api/v1/me/sessions:
    get:
      tags: [Auth]
      operationId: listCurrentUserSessions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Recent browser sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSession"
  /api/v1/me/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Auth]
      operationId: revokeCurrentUserSession
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Session revoked.
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/me/security-events:
    get:
      tags: [Auth]
      operationId: listCurrentUserSecurityEvents
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Durable authentication history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
  /api/v1/me/mfa:
    get:
      tags: [Auth]
      operationId: getCurrentUserMFAStatus
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current MFA enrollment status.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
    delete:
      tags: [Auth]
      operationId: disableCurrentUserMFA
      security:
        - cookieAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MFACode"
      responses:
        "204":
          description: MFA disabled after factor verification.
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/me/mfa/setup:
    post:
      tags: [Auth]
      operationId: beginCurrentUserMFASetup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Unconfirmed TOTP provisioning values.
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri]
                properties:
                  secret:
                    type: string
                  uri:
                    type: string
                    format: uri
  /api/v1/me/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmCurrentUserMFASetup
      security:
        - cookieAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MFACode"
      responses:
        "200":
          description: One-time recovery codes returned after enrollment.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items:
                      type: string
  /api/v1/me/logout:
    post:
      tags: [Auth]
      operationId: logoutCurrentUser
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "204":
          description: All issued sessions revoked and browser cookie expired.
        "401":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/me/remote-project-invites:
    get:
      tags: [Federation]
      operationId: listRemoteProjectInvites
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Remote project invites addressed to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteProjectInvite"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/me/remote-project-invites/{inviteID}/accept:
    post:
      tags: [Federation]
      operationId: acceptRemoteProjectInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteID"
      responses:
        "202":
          description: Remote project invite accepted and response delivery queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteProjectInviteResult"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/me/remote-project-invites/{inviteID}/reject:
    post:
      tags: [Federation]
      operationId: rejectRemoteProjectInvite
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteID"
      responses:
        "202":
          description: Remote project invite rejected and response delivery queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteProjectInviteResult"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/remote-projects:
    get:
      tags: [Federation]
      operationId: listRemoteProjects
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Accepted remote project workspaces visible to the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemoteProject"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/remote-projects/{remoteProjectID}:
    parameters:
      - $ref: "#/components/parameters/RemoteProjectID"
    get:
      tags: [Federation]
