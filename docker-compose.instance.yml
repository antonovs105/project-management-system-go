services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: migrate/migrate:latest@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations/
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:?BACKEND_PORT is required}:8080"
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      APP_ROLE: api
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:?LOCAL_DOMAIN is required}
      REDIS_ADDR: redis:6379
      FEDERATION_BLOCKED_DOMAINS: ${FEDERATION_BLOCKED_DOMAINS:-}
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-true}
      FEDERATION_ALLOW_PRIVATE_NETWORKS: ${FEDERATION_ALLOW_PRIVATE_NETWORKS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      PROJECT_CREATION_POLICY: ${PROJECT_CREATION_POLICY:-everyone}
      AUTH_RATE_LIMIT_PER_SECOND: ${AUTH_RATE_LIMIT_PER_SECOND:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-10}
      DISCOVERY_RATE_LIMIT_PER_SECOND: ${DISCOVERY_RATE_LIMIT_PER_SECOND:-10}
      DISCOVERY_RATE_LIMIT_BURST: ${DISCOVERY_RATE_LIMIT_BURST:-50}
      INBOX_RATE_LIMIT_PER_SECOND: ${INBOX_RATE_LIMIT_PER_SECOND:-20}
      INBOX_RATE_LIMIT_BURST: ${INBOX_RATE_LIMIT_BURST:-100}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:${FRONTEND_PORT}/oauth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:${BACKEND_PORT}/auth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:${BACKEND_PORT}/auth/github/callback}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      federation:
        aliases:
          - ${BACKEND_NETWORK_ALIAS:?BACKEND_NETWORK_ALIAS is required}
      default:

  backend-worker:
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-backend-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${BACKEND_WORKER_METRICS_PORT:?BACKEND_WORKER_METRICS_PORT is required}:9091"
    environment:
      DB_SOURCE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-pms}?sslmode=disable
      APP_ENV: ${APP_ENV:-development}
      APP_ROLE: worker
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      LOCAL_DOMAIN: ${LOCAL_DOMAIN:?LOCAL_DOMAIN is required}
      REDIS_ADDR: redis:6379
      FEDERATION_ALLOW_INSECURE_HTTP: ${FEDERATION_ALLOW_INSECURE_HTTP:-true}
      FEDERATION_ALLOW_PRIVATE_NETWORKS: ${FEDERATION_ALLOW_PRIVATE_NETWORKS:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      PROJECT_CREATION_POLICY: ${PROJECT_CREATION_POLICY:-everyone}
      AUTH_RATE_LIMIT_PER_SECOND: ${AUTH_RATE_LIMIT_PER_SECOND:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-10}
      DISCOVERY_RATE_LIMIT_PER_SECOND: ${DISCOVERY_RATE_LIMIT_PER_SECOND:-10}
      DISCOVERY_RATE_LIMIT_BURST: ${DISCOVERY_RATE_LIMIT_BURST:-50}
      INBOX_RATE_LIMIT_PER_SECOND: ${INBOX_RATE_LIMIT_PER_SECOND:-20}
      INBOX_RATE_LIMIT_BURST: ${INBOX_RATE_LIMIT_BURST:-100}
      METRICS_ADDR: :9091
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      ACTOR_PRIVATE_KEY_ENCRYPTION_KEY: ${ACTOR_PRIVATE_KEY_ENCRYPTION_KEY:?ACTOR_PRIVATE_KEY_ENCRYPTION_KEY is required}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:${FRONTEND_PORT}/oauth/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://localhost:${BACKEND_PORT}/auth/google/callback}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URL: ${GITHUB_OAUTH_REDIRECT_URL:-http://localhost:${BACKEND_PORT}/auth/github/callback}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    networks:
      - default
      - federation

  frontend:
    container_name: ${INSTANCE_NAME:?INSTANCE_NAME is required}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?FRONTEND_PORT is required}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777

networks:
  default:
  federation:
    name: ${FEDERATION_NETWORK:-pms-federation}
    external: true

volumes:
  postgres_data:
  redis_data:
