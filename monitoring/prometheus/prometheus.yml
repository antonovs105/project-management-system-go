global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pms-backend-api
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: backend
          role: api

  - job_name: pms-backend-worker
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets:
          - backend-worker:9091
        labels:
          service: backend
          role: worker
